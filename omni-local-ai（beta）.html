<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>本地全能 AI · 纯前端 · 数据不出本机</title>
<style>
:root{
  --bg:#0d1117; --bg2:#161b22; --bg3:#1c2128; --line:#2b313b;
  --fg:#e6edf3; --fg2:#9aa7b4; --acc:#4f8cff; --acc2:#7c5cff;
  --ok:#3fb950; --warn:#d29922; --err:#f85149; --radius:14px;
}
html[data-theme="light"]{
  --bg:#ffffff; --bg2:#f5f7fa; --bg3:#eceff3; --line:#dfe3e8;
  --fg:#1f2328; --fg2:#5c6773; --acc:#1f6feb; --acc2:#8250df;
  --ok:#1a7f37; --warn:#9a6700; --err:#cf222e;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--fg);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  overflow:hidden;
}
#app{display:flex;height:100%}
/* ---------- 侧栏 ---------- */
#side{
  width:280px;flex:0 0 280px;background:var(--bg2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;transition:transform .25s ease;
}
.side-hd{padding:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--fg2)}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.load{background:var(--warn);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.btn{
  background:var(--bg3);color:var(--fg);border:1px solid var(--line);border-radius:10px;
  padding:8px 12px;font-size:13px;cursor:pointer;transition:.15s;white-space:nowrap;
}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;color:#fff;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.side-bd{flex:1;overflow-y:auto;padding:10px}
.sec-t{font-size:11px;color:var(--fg2);letter-spacing:.08em;margin:14px 8px 6px;text-transform:uppercase}
.conv{
  padding:9px 10px;border-radius:10px;cursor:pointer;font-size:13.5px;color:var(--fg2);
  display:flex;justify-content:space-between;gap:6px;align-items:center;margin-bottom:2px;
}
.conv:hover{background:var(--bg3);color:var(--fg)}
.conv.active{background:var(--bg3);color:var(--fg);border:1px solid var(--line)}
.conv .x{opacity:0;font-size:14px;padding:0 4px}
.conv:hover .x{opacity:.6}
.conv .x:hover{opacity:1;color:var(--err)}
.side-ft{padding:12px;border-top:1px solid var(--line);font-size:12px;color:var(--fg2)}
.row{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.row label{flex:0 0 62px;font-size:12px;color:var(--fg2)}
.row input[type=range]{flex:1;accent-color:var(--acc)}
.row select, .row input[type=text]{
  flex:1;background:var(--bg3);color:var(--fg);border:1px solid var(--line);
  border-radius:8px;padding:6px 8px;font-size:12.5px;min-width:0;
}
.sw{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--fg2);padding:4px 0}
.sw input{accent-color:var(--acc)}
/* ---------- 主区 ---------- */
main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{
  height:54px;flex:0 0 54px;border-bottom:1px solid var(--line);display:flex;align-items:center;
  gap:8px;padding:0 12px;background:var(--bg2)
}
#top .title{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.icon-btn{
  background:transparent;border:1px solid var(--line);color:var(--fg2);border-radius:9px;
  width:34px;height:34px;cursor:pointer;font-size:15px;display:none;place-items:center
}
#chat{flex:1;overflow-y:auto;padding:20px 16px 8px;scroll-behavior:smooth}
.wrap{max-width:860px;margin:0 auto}
.msg{margin-bottom:18px;display:flex;gap:10px}
.msg .av{
  flex:0 0 30px;height:30px;border-radius:9px;display:grid;place-items:center;
  font-size:13px;font-weight:700;background:var(--bg3);color:var(--fg2)
}
.msg.me .av{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.msg .body{flex:1;min-width:0}
.msg .who{font-size:11.5px;color:var(--fg2);margin-bottom:3px}
.bubble{
  background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);
  padding:11px 14px;word-wrap:break-word;overflow-wrap:anywhere
}
.msg.me .bubble{background:linear-gradient(135deg,rgba(79,140,255,.14),rgba(124,92,255,.14))}
.bubble p{margin:0 0 9px}
.bubble p:last-child{margin-bottom:0}
.bubble ul,.bubble ol{margin:0 0 9px;padding-left:22px}
.bubble h1,.bubble h2,.bubble h3{font-size:16px;margin:12px 0 6px}
.bubble a{color:var(--acc)}
.bubble blockquote{margin:0 0 9px;padding:6px 12px;border-left:3px solid var(--acc);color:var(--fg2);background:var(--bg3);border-radius:0 8px 8px 0}
.bubble table{border-collapse:collapse;margin:0 0 9px;font-size:13.5px;width:100%}
.bubble th,.bubble td{border:1px solid var(--line);padding:5px 9px;text-align:left}
.bubble code{background:var(--bg3);padding:1px 5px;border-radius:5px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
pre.code{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:0;margin:0 0 9px;overflow:hidden}
pre.code .ch{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;background:rgba(127,127,127,.09);font-size:11.5px;color:var(--fg2)}
pre.code code{display:block;padding:10px 12px;overflow-x:auto;background:none;font-size:12.8px;line-height:1.55}
.cp{background:transparent;border:1px solid var(--line);color:var(--fg2);border-radius:6px;padding:1px 7px;cursor:pointer;font-size:11px}
/* 思考过程 / 标签 / 性能行 */
.think{border-left:2px solid var(--fg2);padding:2px 0 2px 10px;margin:0 0 8px}
.think>summary{cursor:pointer;list-style:none;font-size:12px;color:var(--fg2)}
.think>summary::-webkit-details-marker{display:none}
.think .tb{white-space:pre-wrap;word-break:break-word;margin-top:6px;font-size:12.5px;color:var(--fg2)}
.tag{display:inline-block;font-size:10px;padding:0 5px;border-radius:999px;background:var(--bg3);color:var(--fg2);border:1px solid var(--line);margin-left:3px}
.stat-line{font-size:11px;color:var(--fg2);margin-top:5px;opacity:.85}
/* 工具卡片 */
.tool-card{
  border:1px dashed var(--acc);border-radius:12px;margin:8px 0;overflow:hidden;background:rgba(79,140,255,.05)
}
.tool-card>summary{
  cursor:pointer;padding:8px 12px;font-size:12.5px;color:var(--acc);list-style:none;display:flex;gap:8px;align-items:center
}
.tool-card>summary::-webkit-details-marker{display:none}
.tool-body{padding:0 12px 10px;font-size:12.5px;color:var(--fg2);white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}
.tool-body pre{background:var(--bg3);padding:8px;border-radius:8px;overflow:auto;margin:6px 0 0;color:var(--fg)}
iframe.sandbox{width:100%;height:340px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:8px}
.frame-bar{display:flex;gap:6px;margin-top:6px}
.typing:after{content:"▋";animation:blink 1s infinite;color:var(--acc)}
/* ---------- 输入区 ---------- */
#composer{border-top:1px solid var(--line);background:var(--bg2);padding:10px 12px}
.cbox{max-width:860px;margin:0 auto}
.crow{display:flex;gap:8px;align-items:flex-end}
textarea{
  flex:1;background:var(--bg3);color:var(--fg);border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;font:inherit;font-size:14px;resize:none;max-height:180px;min-height:44px;outline:none
}
textarea:focus{border-color:var(--acc)}
.hint{font-size:11.5px;color:var(--fg2);margin-top:6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.chip{
  flex:0 0 auto;background:var(--bg3);border:1px solid var(--line);color:var(--fg2);
  border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer
}
.chip:hover{color:var(--acc);border-color:var(--acc)}
/* ---------- 进度 / 遮罩 ---------- */
#prog{
  position:fixed;left:50%;bottom:78px;transform:translateX(-50%);width:min(420px,92vw);
  background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  box-shadow:0 8px 30px rgba(0,0,0,.4);display:none;z-index:60
}
#prog .t{font-size:12.5px;color:var(--fg2);margin-bottom:7px;word-break:break-all}
.bar{height:6px;background:var(--bg3);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--bg3);
  border:1px solid var(--line);border-radius:10px;padding:9px 16px;font-size:13px;z-index:99;
  opacity:0;transition:.25s;pointer-events:none
}
#toast.show{opacity:1}
#mask{
  position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:70;padding:20px
}
#mask .card{
  background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:20px;
  max-width:520px;width:100%;max-height:80vh;overflow:auto
}
#mask h3{margin:0 0 10px;font-size:16px}
#mask p,#mask li{font-size:13.5px;color:var(--fg2)}
#mask code{background:var(--bg3);padding:1px 5px;border-radius:5px;color:var(--fg)}
.file-item{display:flex;justify-content:space-between;gap:6px;font-size:12.5px;color:var(--fg2);padding:4px 8px;border-radius:8px}
.file-item:hover{background:var(--bg3);color:var(--fg)}
.cursor-blink{animation:blink 1s infinite}
@media(max-width:820px){
  #side{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.5)}
  #side.open{transform:none}
  .icon-btn{display:grid}
  #chat{padding:14px 10px 8px}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="side-hd">
      <div class="brand"><span class="dot" id="dot"></span> 本地全能 AI</div>
      <div style="font-size:11.5px;color:var(--fg2);margin-top:4px" id="modelTag">未加载模型</div>
      <button class="btn primary" id="newChat" style="width:100%;margin-top:10px">＋ 新建对话</button>
    </div>
    <div class="side-bd">
      <div class="sec-t">对话</div>
      <div id="convList"></div>
      <div class="sec-t">知识库（本地文件）</div>
      <div id="fileList" style="padding:0 8px;font-size:12.5px;color:var(--fg2)">暂无文件</div>
      <label class="btn" style="display:block;text-align:center;margin:8px;cursor:pointer">
        上传文档（txt/md/csv/json/pdf）
        <input type="file" id="fileInput" multiple accept=".txt,.md,.csv,.json,.js,.py,.html,.css,.pdf" hidden>
      </label>
      <div class="sec-t">长期记忆</div>
      <div id="memList" style="padding:0 8px;font-size:12.5px;color:var(--fg2)">暂无</div>
    </div>
    <div class="side-ft">
      <div class="row">
        <label>模型</label>
        <select id="modelSel"></select>
      </div>
      <div id="cacheTip" style="font-size:11px;color:var(--fg2);margin:-4px 0 8px 62px">模型首次需联网下载，之后可离线</div>
<div class="row"><label>下载源</label><select id="mirrorSel">
<option value="auto">自动测速（推荐）</option>
<option value="hfm">国内镜像 hf-mirror</option>
<option value="hf">官方 HuggingFace</option>
<option value="jsd">jsDelivr CDN</option>
</select></div>
      <div class="row"><label>温度</label><input type="range" id="temp" min="0" max="1.5" step="0.05"><span id="tempV" style="font-size:12px;width:32px;text-align:right">0.7</span></div>
      <div class="row"><label>上下文</label><input type="range" id="ctx" min="1024" max="32768" step="1024"><span id="ctxV" style="font-size:12px;width:38px;text-align:right">4096</span></div>
      <label class="sw">工具自动调用 <input type="checkbox" id="autoTools" checked></label>
      <label class="sw">联网能力 <input type="checkbox" id="netOn" checked></label>
      <label class="sw">语音朗读回复 <input type="checkbox" id="tts"></label>
      <div style="display:flex;gap:6px;margin-top:8px">
        <button class="btn" id="loadBtn" style="flex:1">加载模型</button>
        <button class="btn" id="infoBtn">说明</button>
      </div>
    </div>
  </aside>

  <main>
    <div id="top">
      <button class="icon-btn" id="menuBtn">☰</button>
      <div class="title" id="title">新的对话</div>
      <button class="btn" id="exportBtn" title="导出当前对话">导出</button>
      <button class="btn" id="stopBtn" style="display:none">停止</button>
    </div>
    <div id="chat"><div class="wrap" id="msgs"></div></div>
    <div id="composer">
      <div class="cbox">
        <div class="chips" id="chips"></div>
        <div class="crow">
          <textarea id="input" rows="1" placeholder="问任何事…（Enter 发送，Shift+Enter 换行）"></textarea>
          <button class="btn primary" id="send">发送</button>
          <button class="btn" id="micBtn" title="语音输入">🎤</button>
        </div>
        <div class="hint">
          <span>模型在本机浏览器运行 · 不上传任何数据</span>
          <span id="stat"></span>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="prog"><div class="t" id="progT">准备中…</div><div class="bar"><i id="progB"></i></div></div>
<div id="toast"></div>
<div id="mask"><div class="card" id="maskCard"></div></div>

<script type="module">
import { CreateWebWorkerMLCEngine, CreateMLCEngine, prebuiltAppConfig } from "https://esm.run/@mlc-ai/web-llm";

/* 0. 工具函数 & 存储 */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now = () => new Date().toLocaleString('zh-CN', {hour12:false});
const uid = () => Math.random().toString(36).slice(2,10);
const sleep = ms => new Promise(r=>setTimeout(r,ms));

function toast(msg, ms=2200){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'), ms);
}
const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v) }catch(e){ return d } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)) }catch(e){ toast('存储失败：'+e.message) } }
};

/* IndexedDB：存文档（localStorage 放不下） */
const DB = (()=>{
  let p=null;
  const open=()=> p || (p=new Promise((res,rej)=>{
    const r=indexedDB.open('localai-kv',1);
    r.onupgradeneeded=e=>{ if(!e.target.result.objectStoreNames.contains('kv')) e.target.result.createObjectStore('kv') };
    r.onsuccess=e=>res(e.target.result); r.onerror=e=>rej(e.error);
  }));
  const tx=(mode)=>open().then(db=>db.transaction('kv',mode).objectStore('kv'));
  return {
    async get(k){ const s=await tx('readonly'); return new Promise(r=>{ const q=s.get(k); q.onsuccess=()=>r(q.result) }) },
    async set(k,v){ const s=await tx('readwrite'); return new Promise(r=>{ const q=s.put(v,k); q.onsuccess=()=>r() }) },
    async del(k){ const s=await tx('readwrite'); return new Promise(r=>{ const q=s.delete(k); q.onsuccess=()=>r() }) },
    async all(){ const s=await tx('readonly'); return new Promise(r=>{ const q=s.getAll(); q.onsuccess=()=>r(q.result||[]) }) }
  };
})();

/* 1. 全局状态 */
const S = {
  engine:null, modelId:LS.get('modelId','Qwen2.5-3B-Instruct-q4f16_1-MLC'),
  loading:false, generating:false, stop:false,
  convs:LS.get('convs',{}), convId:null,
  docs:[], memory:LS.get('memory',{}),
  settings:Object.assign({temp:0.7, ctx:4096, autoTools:true, net:true, tts:false, theme:'dark', mirror:'auto'}, LS.get('settings',{}))
};
const saveConvs = () => LS.set('convs', S.convs);
const conv = () => S.convs[S.convId];

/* 兜底清单（WebLLM 列表拿不到时用）：全部国产 */
const FALLBACK = [
  ['Qwen2.5-0.5B-Instruct-q4f16_1-MLC',600],
  ['Qwen2.5-1.5B-Instruct-q4f16_1-MLC',1200],
  ['Qwen2.5-3B-Instruct-q4f16_1-MLC',2300],
  ['Qwen2.5-7B-Instruct-q4f16_1-MLC',4700],
  ['Qwen3-1.7B-q4f16_1-MLC',1400],
  ['Qwen3-4B-q4f16_1-MLC',3100],
  ['DeepSeek-R1-Distill-Qwen-1.5B-q4f16_1-MLC',1200],
  ['DeepSeek-R1-Distill-Qwen-7B-q4f16_1-MLC',4700],
  ['MiniCPM-2B-sft-fp32-MLC',2200],
  ['Qwen3-0.6B-q4f16_1-MLC',700],
  ['Qwen2.5-Coder-1.5B-Instruct-q4f16_1-MLC',1200],
  ['Qwen3-8B-q4f16_1-MLC',5600]
];
/* 国产模型优先：品牌识别（re, 中文名, 标签） */
const BR=[
[/deepseek/i,'深度求索','会思考|国产'],[/qwen/i,'通义千问','中文强|国产'],
[/glm|chatglm/i,'智谱清言','中文|国产'],[/minicpm/i,'面壁小钢炮','端侧|国产'],
[/yi-|yi_/i,'零一万物','中文|国产'],[/baichuan/i,'百川','中文|国产'],
[/internlm/i,'书生浦源','中文|国产'],[/gemma/i,'谷歌Gemma','英文|海外'],
[/llama/i,'Meta Llama','英文强|海外'],[/phi/i,'微软Phi','数学|海外'],
[/smollm|tinyllama/i,'海外小钢炮','超快|海外'],[/mistral/i,'Mistral','英文强|海外']
];
const brOf=id=>BR.find(b=>b[0].test(id));
const isCN=id=>{const b=brOf(id);return b&&/国产/.test(b[2])};
const flagOf=id=>isCN(id)?'🇨🇳':'🌐';
function cnName(id){
  const b=brOf(id);
  const c=id.replace(/-MLC$/,'').replace(/-q4f16_1|-q4f32_1|-q4f16_0|-q8f16_1/gi,'')
            .replace(/-Instruct$/i,'').replace(/-it$/i,'');
  return b?b[1]+' '+c:c;
}
function tagsOf(id){
  const t=[],b=brOf(id);
  if(b) b[2].split('|').forEach(x=>t.push(x));
  const m=id.match(/[-_](\d+(?:\.\d+)?)B\b/i);
  if(m){const s=parseFloat(m[1]); if(s<=2)t.push('轻量'); else if(s>=7)t.push('更强')}
  if(/coder/i.test(id))t.push('代码');
  if(/vision|vl/i.test(id))t.push('看图');
  return [...new Set(t)].slice(0,3);
}
/* 已缓存模型检测（只读 Cache API，不下载任何东西） */
async function cachedModels(){
  const ids=new Set();
  try{
    if(!window.caches) return ids;
    for(const n of await caches.keys()){
      if(!/webllm|model|wasm/i.test(n)) continue;
      try{
        const c=await caches.open(n);
        for(const r of await c.keys()){
          const m=r.url.match(/mlc-ai\/([^/]+?)(?:\/|-q4)/i)||r.url.match(/\/([A-Za-z0-9._-]+)-MLC\//i);
          if(m) ids.add(m[1]);
        }
      }catch(e){}
    }
  }catch(e){}
  return ids;
}
async function markCached(){
  const ids=await cachedModels(), arr=[...ids];
  $$('#modelSel option').forEach(o=>{
    if(o.value==='__custom__') return;
    const hit=ids.has(o.value)||arr.some(x=>o.value.indexOf(x)===0);
    o.textContent=(hit?'✅ ':'⬇️ ')+o.textContent.replace(/^[✅⬇️ ]+/,'');
  });
  const hit=arr.some(x=>S.modelId.indexOf(x)===0), tg=tagsOf(S.modelId).join('/');
  $('#cacheTip').textContent=(hit?'✅ 本机已缓存，可离线用':'⬇️ 首次需联网下载，之后离线可用')
    +(tg?' · '+tg:'')+(ids.size?'（共缓存 '+ids.size+' 个）':'');
}

/* 多源下载：同一模型换不同 CDN，测速选最快（只换地址，文件内容不变） */
const SRC=[
{k:'hfm',n:'国内 hf-mirror',f:u=>u.replace('https://huggingface.co','https://hf-mirror.com')},
{k:'hf', n:'官方 HuggingFace',f:u=>u},
{k:'jsd',n:'jsDelivr CDN',f:u=>u.replace('https://huggingface.co/mlc-ai/','https://cdn.jsdelivr.net/gh/mlc-ai/').replace('/resolve/main/','@main/')}
];
const fixLib=(u,k)=>!u?u:(k==='hf'?u:u.replace('https://raw.githubusercontent.com/mlc-ai/binary-mlc-llm-libs/main/','https://cdn.jsdelivr.net/gh/mlc-ai/binary-mlc-llm-libs@main/'));
async function probe(u,ms=4500){const t=performance.now();try{const r=await fetch(u,{cache:'no-store',signal:AbortSignal.timeout(ms)});if(!r.ok)return -1;await r.text();return performance.now()-t}catch(e){return -1}}
async function pickSrc(rec){
  const set=S.settings.mirror||'auto';
  if(set!=='auto')return{s:SRC.find(x=>x.k===set)||SRC[0],ms:0};
  const repo=(rec.model.match(/mlc-ai\/([^/@]+)/)||[])[1]; if(!repo)return{s:SRC[0],ms:0};
  showProg('测速：正在挑最快的下载源…',0);
  const urls=['https://hf-mirror.com','https://huggingface.co'].map(h=>h+'/mlc-ai/'+repo+'/resolve/main/mlc-chat-config.json')
    .concat('https://cdn.jsdelivr.net/gh/mlc-ai/'+repo+'@main/mlc-chat-config.json');
  const rs=await Promise.all(urls.map(u=>probe(u)));
  let bi=-1,bt=Infinity; rs.forEach((t,i)=>{if(t>=0&&t<bt){bt=t;bi=i}});
  return{s:bi<0?SRC[0]:SRC[bi],ms:bi<0?-1:Math.round(bt)};
}
async function mkCfg(id){
  let list=[]; try{list=(prebuiltAppConfig&&prebuiltAppConfig.model_list)||[]}catch(e){}
  const rec=list.find(m=>m.model_id===id); if(!rec)return null;
  const{s,ms}=await pickSrc(rec);
  return{cfg:{...prebuiltAppConfig,model_list:list.map(m=>m.model_id===id?{...m,model:s.f(m.model),model_lib:fixLib(m.model_lib,s.k)}:m)},s,ms};
}

/* 2. 模型加载（WebGPU，浏览器内推理） */
async function loadModel(id){
  if(S.loading) return;
  if(!navigator.gpu){ showInfo('浏览器不支持 WebGPU','请使用 Chrome / Edge 113+ 或 Safari 18+，并确认显卡可用。'); return }
  S.loading=true; setDot('load'); $('#loadBtn').disabled=true;
  showProg('初始化引擎…',0);
  try{
    const r = await mkCfg(id);
    const cfg = r&&r.cfg, key = r&&r.s? r.s.k : 'raw';
    if(r&&r.s){
      const t = r.ms>0? '（'+r.ms+'ms）' : '';
      $('#stat').textContent = '下载源：'+r.s.n+t;
      addSysMsg('本次下载源：'+r.s.n+t);
    }
    if(S.engine){
      if(S.srcKey===key){ try{ await S.engine.reload(id) }catch(e){ await S.engine.unload(); S.engine=null } }
      else { try{ await S.engine.unload() }catch(e){} S.engine=null }
    }
    if(!S.engine){
      let engine=null;
      const opt={initProgressCallback:p=>onProg(p)}; if(cfg) opt.appConfig=cfg;
      try{
        const code = `import { WebWorkerMLCEngineHandler } from "https://esm.run/@mlc-ai/web-llm";
const handler = new WebWorkerMLCEngineHandler();
self.onmessage = (msg) => handler.onmessage(msg);`;
        const w = new Worker(URL.createObjectURL(new Blob([code],{type:'text/javascript'})), {type:'module'});
        engine = await CreateWebWorkerMLCEngine(w, id, opt);
      }catch(e){
        console.warn('worker 模式失败，回退主线程', e);
        engine = await CreateMLCEngine(id, opt);
      }
      S.engine = engine; S.srcKey = key;
    }
    S.modelId=id; LS.set('modelId',id);
    $('#modelTag').textContent = id.replace(/-MLC$/,'') + ' · 就绪';
    setDot('on'); toast('模型已加载，开始对话吧'); markCached();
    addSysMsg('模型加载完成：'+id+'。可以直接提问，也可以让它「写个贪吃蛇」「分析这份 CSV」「搜索 XX」。');
  }catch(e){
    console.error(e); setDot(''); 
    showInfo('模型加载失败', '错误信息：<code>'+esc(e.message||e)+'</code><br><br>常见原因：显存不足（换更小的模型）、首次下载被中断、或浏览器不支持 WebGPU。');
  }finally{
    S.loading=false; $('#loadBtn').disabled=false; hideProg();
  }
}
function onProg(p){
  const txt = p.text || '';
  const m = txt.match(/\[(\d+)\/(\d+)\]/);
  let pct = p.progress!=null ? p.progress : (m? (+m[1]/+m[2]) : 0);
  showProg(txt, Math.round(pct*100));
}
function showProg(t,p){ $('#prog').style.display='block'; $('#progT').textContent=t; $('#progB').style.width=(p||0)+'%' }
function hideProg(){ $('#prog').style.display='none' }
function setDot(s){ $('#dot').className = 'dot' + (s?' '+s:'') }

function runJS(code, timeout=8000){
  return new Promise(resolve=>{
    const src = `
      let _logs=[];
      const _f=(...a)=>_logs.push(a.map(x=>{try{return typeof x==='object'&&x!==null?JSON.stringify(x):String(x)}catch(e){return String(x)}}).join(' '));
      console.log=_f; console.info=_f; console.warn=_f; console.error=_f;
      self.onmessage=(e)=>{
        try{
          const r = (new Function(e.data))();
          if(r && typeof r.then==='function'){
            r.then(v=>done(0,v)).catch(er=>done(1,String(er&&er.message||er)));
          } else done(0,r);
        }catch(er){ done(1, String(er && er.stack || er)) }
      };
      function done(err,val){
        let v;
        try{ v = err? null : (val===undefined? '(无返回值)' : (typeof val==='object'? JSON.stringify(val,null,1) : String(val))) }catch(e){ v='[不可序列化]' }
        self.postMessage({ok:!err, value: err? String(err) : v, logs:_logs.join('\\n')});
      }
    `;
    let w;
    try{ w = new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'}))) }
    catch(e){ return resolve('JS 沙箱创建失败：'+e.message) }
    const t = setTimeout(()=>{ w.terminate(); resolve('执行超时（>'+timeout+'ms），请简化代码') }, timeout);
    w.onmessage = e => { clearTimeout(t); w.terminate();
      const r=e.data; resolve((r.logs? r.logs+'\n':'') + (r.ok? (r.value||'') : '错误：'+r.value));
    };
    w.onerror = e => { clearTimeout(t); w.terminate(); resolve('执行错误：'+e.message) };
    w.postMessage(code);
  });
}

async function toolSearch(q){
  if(!S.settings.net) return '联网能力已关闭';
  const out=[];
  try{
    const u='https://zh.wikipedia.org/w/api.php?action=query&list=search&srsearch='+encodeURIComponent(q)+'&srlimit=5&format=json&origin=*';
    const r=await (await fetch(u)).json();
    for(const it of (r.query&&r.query.search||[])){
      out.push(`[维基] ${it.snippet.replace(/<[^>]+>/g,'')}`);
    }
    const su='https://zh.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(q);
    try{ const sr=await (await fetch(su)).json(); if(sr.extract) out.unshift('[维基摘要] '+sr.extract) }catch(e){}
  }catch(e){ out.push('维基搜索失败：'+e.message) }
  try{
    const du='https://api.duckduckgo.com/?q='+encodeURIComponent(q)+'&format=json&no_html=1&skip_disambig=1';
    const dr=await (await fetch(du)).json();
    if(dr.AbstractText) out.push('[DDG] '+dr.AbstractText+(dr.AbstractURL?' 来源:'+dr.AbstractURL:''));
    for(const t of (dr.RelatedTopics||[]).slice(0,6)) if(t.Text) out.push('[DDG] '+t.Text);
  }catch(e){}
  return out.length? out.join('\n') : '没有找到结果（可能被 CORS 拦截），试试 web_fetch 抓取具体网页。';
}

async function toolFetch(url){
  if(!S.settings.net) return '联网能力已关闭';
  const proxies = [
    u=>'https://r.jina.ai/'+u,
    u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
    u=>'https://corsproxy.io/?'+encodeURIComponent(u)
  ];
  for(const p of proxies){
    try{
      const r=await fetch(p(url), {signal:AbortSignal.timeout(15000)});
      if(!r.ok) continue;
      const t=await r.text();
      const clean=t.replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<style[\s\S]*?<\/style>/gi,'').replace(/<[^>]+>/g,' ').replace(/\s{2,}/g,' ').trim();
      return (clean||t).slice(0,6000);
    }catch(e){}
  }
  return '抓取失败：所有公开 CORS 代理都不可用（这是浏览器沙箱限制，非程序问题）。';
}

    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),5000);

async function readPDF(file){
  try{
    if(!window.pdfjsLib){
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
      window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
    const buf=await file.arrayBuffer();
    const doc=await window.pdfjsLib.getDocument({data:buf}).promise;
    let txt='';
    for(let i=1;i<=Math.min(doc.numPages,60);i++){
      const pg=await doc.getPage(i); const c=await pg.getTextContent();
      txt += c.items.map(x=>x.str).join(' ')+'\n';
    }
    return txt;
  }catch(e){ return '[PDF 解析失败：'+e.message+']' }
}

async function execTool(call){
  const {tool, args={}} = call||{};
  try{
    switch(tool){
      case 'js': return await runJS(String(args.code||''));
      case 'web_search': return await toolSearch(String(args.query||''));
      case 'web_fetch': return await toolFetch(String(args.url||''));
      case 'download': return toolDownload(args);
      case 'speak': return toolSpeak(args.text);
      case 'datetime': return now() + '（' + new Date().toString() + '）';
      case 'read_doc': {
        if(!S.docs.length) return '知识库为空，请让用户先在左侧上传文件。';
        if(!args.name) return '文件清单：'+S.docs.map(d=>d.name+'（'+d.size+'字符）').join('、');
        const d = S.docs.find(x=>x.name.includes(String(args.name))) || S.docs[0];
        return `【${d.name}】\n` + d.content.slice(0, 12000);
      }
      case 'remember': { S.memory[String(args.key)] = String(args.value); LS.set('memory',S.memory); renderMem(); return '已记住：'+args.key }
      case 'recall': {
        if(!args.key) return Object.keys(S.memory).length? '记忆 keys：'+Object.keys(S.memory).join('、') : '没有记忆';
        return S.memory[String(args.key)] || ('没有 key='+args.key);
      }
      case 'html': return '__HTML__';  // 由 UI 层渲染
      default: return '未知工具「'+tool+'」。可用：js / html / web_search / web_fetch / read_doc / download / speak / remember / recall / datetime';
    }
  }catch(e){ return '工具执行出错：'+(e&&e.message||e) }
}

/* 4. Markdown 渲染（轻量 + 安全） */
function md(src){
  let s = esc(src);
  s = s.replace(/```(\w*)\n?([\s\S]*?)```/g, (m,lang,code)=>
    `<pre class="code"><div class="ch"><span>${lang||'code'}</span><button class="cp" data-c="${encodeURIComponent(code)}">复制</button></div><code>${code}</code></pre>`);
  s = s.replace(/^######\s?(.*)$/gm,'<h3>$1</h3>').replace(/^#####\s?(.*)$/gm,'<h3>$1</h3>')
       .replace(/^####\s?(.*)$/gm,'<h3>$1</h3>').replace(/^###\s?(.*)$/gm,'<h3>$1</h3>')
       .replace(/^##\s?(.*)$/gm,'<h2>$1</h2>').replace(/^#\s?(.*)$/gm,'<h1>$1</h1>');
  s = s.replace(/^\s*&gt;\s?(.*)$/gm,'<blockquote>$1</blockquote>');
  s = s.replace(/^\s*[-*]\s+(.*)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>)/gs,'<ul>$1</ul>');
  s = s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>');
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.split(/\n{2,}/).map(p=> /^<(h[1-3]|ul|ol|li|blockquote|pre|table)/.test(p.trim())? p : (p.trim()? '<p>'+p.replace(/\n/g,'<br>')+'</p>' : '')).join('');
  return s;
}
/* 流式显示时隐藏未完成的 tool 块（兼容 ```tool / ```TOOL / ```json 变体） */
const FENCE = '```';
function fenceAt(t, from){
  const m = /```[ \t]*(?:tool|action|tool_call|json-tool)[ \t]*\r?\n/i.exec(t.slice(from));
  return m? {start: from + m.index, end: from + m.index + m[0].length} : null;
}
function visible(t){
  let from=0;
  while(true){
    const f = fenceAt(t, from);
    if(!f) return t;
    const e = t.indexOf(FENCE, f.end);
    if(e<0) return t.slice(0, f.start);           // 未闭合：整段隐藏
    t = t.slice(0, f.start) + t.slice(e+FENCE.length);
    from = f.start;
  }
}
function extractTools(t){
  const re=/```[ \t]*(?:tool|action|tool_call|json-tool)[ \t]*\r?\n([\s\S]*?)```/gi; const out=[]; let m;
  while((m=re.exec(t))){
    let s=m[1].trim(); const a=s.indexOf('{'); const b=s.lastIndexOf('}');
    if(a>=0&&b>a) s=s.slice(a,b+1);
    try{ out.push(JSON.parse(s)) }catch(e){ out.push({tool:'__bad__',args:{raw:m[1].slice(0,200)}}) }
  }
  return out;
}

/* 6. 生成主循环（含工具循环） */
async function streamOnce(messages){
  let full='';
  const {el, bubble}=makeStreamBubble();
  const t0=performance.now();
  const chunks = await S.engine.chat.completions.create({
    messages,
    stream:true,
    temperature:+S.settings.temp,
    max_tokens: Math.min(4096, +S.settings.ctx)
  });
  for await (const c of chunks){
    if(S.stop) break;
    const d = c.choices?.[0]?.delta?.content || '';
    full += d;
    bubble.innerHTML = md(visible(full)) + '<span class="typing"></span>';
    $('#chat').scrollTop = $('#chat').scrollHeight;
  }
  bubble.innerHTML = md(visible(full));
  const dt=(performance.now()-t0)/1000;
  S.stat='';
  if(full.length>10 && dt>0.3){
    S.stat = (full.length/dt).toFixed(1)+' 字/秒';
    const s=document.createElement('div'); s.className='stat-line';
    s.textContent='⚡ '+S.stat+' · 耗时 '+dt.toFixed(1)+'s · 共 '+full.length+' 字';
    el.querySelector('.body').appendChild(s);
  }
  return full;
}

async function send(text){
  text = (text||'').trim();
  if(!text || S.generating) return;
  if(!S.engine){ toast('请先点「加载模型」'); return loadModel(S.modelId) }
  const c=conv(); if(!c) return newConv();
  c.msgs.push({role:'user', content:text});
  if(c.msgs.filter(m=>m.role==='user').length===1) c.title = text.slice(0,22);
  renderMsgs();
  S.generating=true; S.stop=false;
  $('#stopBtn').style.display='block'; $('#send').disabled=true;
  $('#stat').textContent = '生成中…';
  try{
    let messages=[{role:'system',content:buildSystem()}, ...c.msgs.filter(m=>m.ui!=='sys').map(m=>({role:m.role,content:m.content}))];
    let finalText='';
    for(let round=0; round<6 && !S.stop; round++){
      const raw = await streamOnce(messages);
      finalText = raw;
      const calls = S.settings.autoTools ? extractTools(raw) : [];
      if(!calls.length) break;
      // 保留模型思考过程，再标记已调用工具
      const last = $('#msgs').lastElementChild;
      if(last){
        const think = visible(raw).trim();
        last.querySelector('.bubble').innerHTML =
          (think? `<details class="think"><summary>💭 思考过程（点击展开）</summary><div class="tb">${md(think)}</div></details>` : '')
          + '<i style="color:var(--fg2)">已调用工具…</i>';
      }
      messages.push({role:'assistant', content: raw});
      const results=[];
      for(const call of calls){
        if(S.stop) break;
        const r = await execTool(call);
        results.push(`【工具 ${call.tool} 结果】\n` + (r==='__HTML__' ? '（HTML 已在界面中渲染给用户）' : String(r).slice(0,6000)));
        if(call.tool==='html') renderHTMLCard(call.args);
      }
      const resText = results.join('\n\n') + '\n\n请基于以上工具结果继续回答用户。如果还需要调用工具，继续输出 ```tool 代码块；否则直接给出最终答案（不要再提工具 JSON）。';
      const lastMsg = $('#msgs').lastElementChild;
      if(lastMsg){
        const card=document.createElement('details'); card.className='tool-card'; card.open=true;
        card.innerHTML=`<summary>⚙️ 调用了 ${calls.map(x=>x.tool).join('、')}</summary>
          <div class="tool-body">${results.map((r,i)=>`<b>${esc(calls[i].tool)}</b>\n${esc(r.slice(0,1500))}`).join('\n\n')}</div>`;
        lastMsg.querySelector('.body').appendChild(card);
      }
      messages.push({role:'user', content:resText});
    }
    const finalMsg = {role:'assistant', content: visible(finalText)};
    // 把最后一个流式气泡内容写回消息对象
    const lastEl = $('#msgs').lastElementChild;
    if(lastEl){
      const b=lastEl.querySelector('.bubble');
      b.innerHTML = md(finalMsg.content || '（已通过工具完成）');
      finalMsg.toolsHtml = [...lastEl.querySelectorAll('.tool-card, iframe.sandbox, .frame-bar')].map(x=>x.outerHTML).join('');
    }
    c.msgs.push(finalMsg);
    c.updated=Date.now(); saveConvs(); renderConvs();
    if(S.settings.tts && finalMsg.content) toolSpeak(finalMsg.content.replace(/```[\s\S]*?```/g,''));
  }catch(e){
    console.error(e); toast('生成出错：'+(e&&e.message||e));
  }finally{
    S.generating=false; S.stop=false;
    $('#stopBtn').style.display='none'; $('#send').disabled=false; $('#stat').textContent='就绪';
  }
}

function renderHTMLCard({title, html}){
  const last=$('#msgs').lastElementChild; if(!last) return;
  const wrap=document.createElement('div');
  const iframe=document.createElement('iframe');
  iframe.className='sandbox'; iframe.setAttribute('sandbox','allow-scripts allow-modals allow-forms allow-popups');
  iframe.srcdoc = String(html||'');
  wrap.appendChild(iframe);
  const bar=document.createElement('div'); bar.className='frame-bar';
  const b1=document.createElement('button'); b1.className='btn'; b1.textContent='在新窗口打开';
  b1.onclick=()=>{ const w=window.open('', '_blank'); if(w){ w.document.write(String(html||'')); w.document.close() } };
  const b2=document.createElement('button'); b2.className='btn'; b2.textContent='下载 HTML';
  b2.onclick=()=>toolDownload({filename:(title||'app')+'.html', content:String(html||''), mime:'text/html'});
  const b3=document.createElement('button'); b3.className='btn'; b3.textContent='全屏';
  b3.onclick=()=>{ if(iframe.requestFullscreen) iframe.requestFullscreen() };
  bar.append(b1,b2,b3); wrap.appendChild(bar);
  last.querySelector('.body').appendChild(wrap);
  $('#chat').scrollTop=$('#chat').scrollHeight;
}

/* 7. 事件绑定 */
function initModels(){
  const sel=$('#modelSel'); let list=[];
  try{
    list = (prebuiltAppConfig?.model_list||[]).map(m=>[m.model_id, Math.round((m.vram_required_MB||0))]);
  }catch(e){}
  if(!list.length) list = FALLBACK;
  /* 去重 + 只保留 6GB 以内的（浏览器能跑的） */
  const seen=new Set();
  let use = list.filter(x=>x[1] && x[1]<=6000 && !seen.has(x[0]) && seen.add(x[0]));
  if(!use.length) use = list.slice(0,40);
  /* 国产优先分组 */
  const cn  = use.filter(x=>isCN(x[0])).sort((a,b)=>a[1]-b[1]);
  const intl= use.filter(x=>!isCN(x[0])).sort((a,b)=>a[1]-b[1]);
  const opt = ([id,v])=>{
    const t=tagsOf(id);
    return `<option value="${id}">${flagOf(id)} ${cnName(id)} · ${v}MB${t.length?' · '+t.join('/'):''}</option>`;
  };
  sel.innerHTML =
    (cn.length   ? `<optgroup label="🇨🇳 国产模型（推荐 · ${cn.length} 个）">${cn.map(opt).join('')}</optgroup>` : '')
  + (intl.length ? `<optgroup label="🌐 海外开源（高级用户 · ${intl.length} 个）">${intl.map(opt).join('')}</optgroup>` : '')
  + `<option value="__custom__">✏️ 自定义模型 ID…</option>`;
  sel.value = S.modelId;
  if(!cn.concat(intl).some(x=>x[0]===S.modelId)){
    const o=document.createElement('option'); o.value=S.modelId; o.textContent=S.modelId; sel.appendChild(o); sel.value=S.modelId;
  }
  sel.onchange=()=>{
    if(sel.value==='__custom__'){
      const v=prompt('输入 WebLLM 模型 ID，例如 Qwen2.5-7B-Instruct-q4f16_1-MLC');
      if(v){ S.modelId=v.trim(); const o=document.createElement('option'); o.value=S.modelId; o.textContent=S.modelId; sel.appendChild(o); sel.value=S.modelId }
      else return;
    } else S.modelId=sel.value;
    LS.set('modelId',S.modelId);
    markCached();
    if(S.engine){ toast('切换模型中…'); loadModel(S.modelId) } else toast('将加载：'+S.modelId);
  };
}
function bindUI(){
  $('#newChat').onclick=newConv;
  $('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
  $('#loadBtn').onclick=()=>loadModel(S.modelId);
  $('#send').onclick=()=>{ const v=$('#input').value; $('#input').value=''; autoH(); send(v) };
  $('#exportBtn').onclick=()=>{
    const c=conv(); if(!c) return;
    const txt = '# '+c.title+'\n\n' + c.msgs.filter(m=>m.ui!=='sys').map(m=>`## ${m.role==='user'?'我':'AI'}\n\n${m.content}`).join('\n\n');
    toolDownload({filename:(c.title||'对话').replace(/[\\/:*?"<>|]/g,'_')+'.md', content:txt, mime:'text/markdown'});
  };
  $('#stopBtn').onclick=()=>{ S.stop=true; try{ S.engine?.interruptGenerate() }catch(e){} };
  $('#input').addEventListener('keydown', e=>{
    if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); $('#send').click() }
  });
  $('#input').addEventListener('input', autoH);
  function autoH(){ const t=$('#input'); t.style.height='auto'; t.style.height=Math.min(t.scrollHeight,180)+'px'; }

  const bindRange=(sel,key,fmt)=>{
    const el=$(sel); el.value=S.settings[key];
    const out=$(sel+'V'); if(out) out.textContent=fmt(S.settings[key]);
    el.oninput=()=>{ S.settings[key]=+el.value; if(out) out.textContent=fmt(+el.value); LS.set('settings',S.settings) };
  };
  bindRange('#temp','temp',v=>v.toFixed(2));
  bindRange('#ctx','ctx',v=>v);
  const msel=$('#mirrorSel'); if(msel){ msel.value=S.settings.mirror||'auto';
    msel.onchange=()=>{ S.settings.mirror=msel.value; LS.set('settings',S.settings); toast('下载源已设为：'+msel.selectedOptions[0].text) } }
  $('#autoTools').checked=S.settings.autoTools; $('#autoTools').onchange=e=>{S.settings.autoTools=e.target.checked;LS.set('settings',S.settings)};
  $('#netOn').checked=S.settings.net; $('#netOn').onchange=e=>{S.settings.net=e.target.checked;LS.set('settings',S.settings)};
  $('#tts').checked=S.settings.tts; $('#tts').onchange=e=>{S.settings.tts=e.target.checked;LS.set('settings',S.settings)};
  $('#infoBtn').onclick=showHelp;

  $('#fileInput').onchange=async e=>{
    for(const f of e.target.files){
      let content='';
      if(f.name.toLowerCase().endsWith('.pdf')) content=await readPDF(f);
      else content=await f.text();
      const doc={id:uid(), name:f.name, content:content.slice(0,200000), size:content.length};
      S.docs.push(doc); await DB.set(doc.id, doc);
    }
    renderDocs(); toast('已加入知识库，可直接提问');
    e.target.value='';
  };

  // 语音输入
  $('#micBtn').onclick=()=>{
    const R=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!R){ toast('当前浏览器不支持语音输入（建议 Chrome）'); return }
    const r=new R(); r.lang='zh-CN'; r.interimResults=false;
    $('#micBtn').textContent='🔴';
    r.onresult=e=>{ $('#input').value += e.results[0][0].transcript; autoH() };
    r.onend=()=>{ $('#micBtn').textContent='🎤' };
    r.start();
  };

  // 代码块复制 + 数据主权按钮
  document.addEventListener('click', e=>{
    if(e.target.classList.contains('cp')){
      const code=decodeURIComponent(e.target.dataset.c||'');
      navigator.clipboard.writeText(code).then(()=>{ e.target.textContent='已复制'; setTimeout(()=>e.target.textContent='复制',1200) });
    }
    if(e.target.id==='btnExportAll') exportAll();
    if(e.target.id==='btnWipe') wipeAll();
  });

  const chips=['写个贪吃蛇游戏','做一个番茄钟工具','帮我算复利收益','画一个数据可视化图表','总结我上传的文档','搜索今天的新闻','把这段 JSON 转成 CSV','写一份周报模板'];
  $('#chips').innerHTML = chips.map(t=>`<div class="chip">${t}</div>`).join('');
  $$('#chips .chip').forEach(c=>c.onclick=()=>{ $('#input').value=c.textContent; autoH(); $('#input').focus() });
}
/* 数据主权：导出 / 清空 */
async function exportAll(){
  try{
    const docs=await DB.all();
    toolDownload({filename:'local-ai-data-'+Date.now()+'.json',mime:'application/json',
      content:JSON.stringify({app:'omni-local-ai',version:1,exportedAt:now(),
        settings:S.settings,conversations:S.convs,memory:S.memory,
        documents:(docs||[]).map(d=>({name:d.name,size:d.size,content:d.content}))},null,1)});
    toast('已导出：对话 + 文档 + 记忆');
  }catch(e){ toast('导出失败：'+e.message) }
}
async function wipeAll(){
  if(!confirm('确定清空本机全部数据？含所有对话、上传文档、长期记忆。不可恢复。')) return;
  try{ localStorage.clear() }catch(e){}
  try{ for(const d of (await DB.all())||[]) await DB.del(d.id) }catch(e){}
  S.convs={}; S.docs=[]; S.memory={};
  newConv(); renderDocs(); renderMem(); toast('已清空本机数据');
}
function showHelp(){
  showInfo('使用说明', `
  <p>这是一个<b>单文件纯前端</b>应用：模型以 WebGPU 在浏览器里推理，<b>所有数据留在本机</b>，不经过任何服务器。</p>
  <ol>
    <li>左侧选模型 → 点「加载模型」（首次需下载几百 MB～几 GB，之后走浏览器缓存，可离线）。</li>
    <li><b>下载慢/下不动？</b>把「下载源」从「自动测速」切到 <code>国内镜像 hf-mirror</code>。自动模式会同时探测 hf-mirror / HuggingFace / jsDelivr，挑响应最快的那条路，只换下载地址、模型文件本身完全一样。</li>
    <li>直接对话；需要真实动作时，模型会自动调用工具。</li>
    <li>工具：JS 沙箱计算、HTML 应用、联网搜索/抓网页、读本地文档、生成下载文件、语音、长期记忆。</li>
  </ol>
  <p><b>推荐打开方式：</b>在本文件所在目录执行 <code>python3 -m http.server 8000</code>，浏览器访问 <code>http://localhost:8000</code>。直接双击打开在部分浏览器上会受限于 file:// 协议。</p>
  <p><b>硬件参考：</b>8G 内存选 1.5B～3B；16G 选 3B～7B；显存不足请换更小模型。</p>
  <p><b>诚实边界：</b>浏览器沙箱内无法删除/修改你磁盘上的文件、无法执行系统命令；本地小模型能力弱于云端大模型，复杂任务建议分步提问。</p>
  <p><b>数据主权：</b>对话、文档、记忆全部只存在你本机浏览器里，没有任何服务器。
  <button class="btn" id="btnExportAll">导出全部数据</button>
  <button class="btn" id="btnWipe">一键清空</button></p>
  `);
}
function showInfo(title, html){
  $('#maskCard').innerHTML=`<h3>${title}</h3><div>${html}</div><div style="text-align:right;margin-top:14px"><button class="btn primary" onclick="document.getElementById('mask').style.display='none'">知道了</button></div>`;
  $('#mask').style.display='grid';
}
$('#mask').onclick=e=>{ if(e.target.id==='mask') $('#mask').style.display='none' };

/* 8. 启动 */
async function boot(){
  document.documentElement.dataset.theme = S.settings.theme || 'dark';
  initModels(); bindUI(); renderConvs(); renderMem(); markCached();
  if(!Object.keys(S.convs).length) newConv(); else { S.convId=Object.values(S.convs).sort((a,b)=>b.updated-a.updated)[0].id; renderConvs(); renderMsgs(); $('#title').textContent=conv().title }
  try{ const docs=await DB.all(); if(docs&&docs.length){ S.docs=docs; renderDocs() } }catch(e){}
  if(!navigator.gpu){ setDot(''); showInfo('WebGPU 不可用','本机浏览器没有启用 WebGPU，无法在浏览器内跑模型。<br><br>请用 Chrome / Edge 最新版，并在 <code>chrome://gpu</code> 确认 WebGPU 已启用。'); return }
  if(location.protocol==='file:'){
    addSysMsg('提示：以 file:// 直接打开可能受浏览器限制；建议用 python3 -m http.server 起本地服务访问。');
  }
  addSysMsg('准备就绪：点左下角「加载模型」开始（首次会下载模型文件）。');
}
boot();
</script>
